services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastcgi_app
    networks:
      - internal_network
    restart: unless-stopped

  nginx:
    image: nginx:bookworm
    container_name: nginx_proxy
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    networks:
      - internal_network
    depends_on:
      - app
    restart: unless-stopped

networks:
  internal_network:
    driver: bridge